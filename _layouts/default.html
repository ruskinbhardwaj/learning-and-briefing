<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/landscape/' | relative_url }}">Landscape</a>
        <a href="{{ '/morning/' | relative_url }}">Morning</a>
        <a href="{{ '/briefings/' | relative_url }}">Briefings</a>
        <a href="{{ '/learning/' | relative_url }}">Learning</a>
        <a href="{{ '/topics/' | relative_url }}">Topics</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      Written to the <a href="https://github.com/{{ site.repo }}/tree/main/principles">principles in the repo</a>.
      Every page is dated; check "Last reviewed" before relying on it.
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>
  <script src="{{ '/assets/js/staleness.js' | relative_url }}" defer></script>
</body>
</html>
